<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>Cadastro de Colaboradores</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 40px 20px;
    font-family: 'Georgia', 'Times New Roman', serif;
    background-color: #FFFFF0;
    color: #3E2723;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 560px;
    background-color: #FFFDF5;
    border: 1px solid #D4AF37;
    border-radius: 10px;
    padding: 40px 44px 48px;
    box-shadow: 0 4px 18px rgba(112, 84, 32, 0.15);
  }

  h1 {
    text-align: center;
    font-size: 26px;
    color: #6B4226;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }

  h2 {
    text-align: center;
    font-size: 16px;
    font-weight: normal;
    color: #A67C3D;
    margin: 0 0 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid #D4AF37;
  }

  form {
    display: flex;
    flex-direction: column;
  }

  label, .campo-label {
    font-size: 14px;
    font-weight: bold;
    color: #6B4226;
    margin-bottom: 6px;
    margin-top: 18px;
    display: block;
  }

  input[type="text"],
  input[type="number"],
  textarea {
    width: 100%;
    padding: 11px 14px;
    font-family: 'Georgia', serif;
    font-size: 14px;
    color: #3E2723;
    background-color: #FFFFFA;
    border: 1px solid #C9B486;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  input[type="text"]:focus,
  input[type="number"]:focus,
  textarea:focus {
    border-color: #D4AF37;
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
  }

  input::placeholder,
  textarea::placeholder {
    color: #B0A48D;
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  #enviar {
    margin-top: 32px;
    padding: 13px 20px;
    font-family: 'Georgia', serif;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #FFFDF5;
    background: linear-gradient(180deg, #C9A227 0%, #A67C3D 100%);
    border: 1px solid #8C6A2C;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.2s ease, transform 0.1s ease;
  }

  #enviar:hover {
    opacity: 0.92;
  }

  #enviar:active {
    transform: scale(0.98);
  }

  @media (max-width: 480px) {
    .container {
      padding: 28px 22px 34px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Lojas Brincos e Companhia</h1>
  <h2>Cadastro de Novos Colaboradores</h2>

  <form id="form1" name="form1" method="post" action="processaCadastro.php">

    <label for="campo1nome">Nome</label>
    <input 
    name="campo1nome" 
    type="text" 
    id="campo1nome" 
    placeholder="Digitar Nome" 
    required>

    <label for="campo2idade">Idade</label>
    <input 
    name="campo2idade" 
    type="number" 
    id="campo2idade" 
    placeholder="Digite a idade" 
    min="14" 
    max="100" 
    title="Informe uma idade entre 14 e 100 anos"
    required>

    <label for="campo3profissao">Profissão</label>
    <input 
    name="campo3profissao" 
    type="text" 
    id="campo3profissao" 
    placeholder="Digite a profissão" 
    required>

    <label for="campo4salario">Salário pretendido</label>
    <input 
    name="campo4salario" 
    type="number" 
    id="campo4salario" 
    placeholder="Digite o salário pretendido" 
    min="0" 
    step="0.01" 
    required>

    <label for="campo5experiencia">Experiência anterior</label>
    <textarea 
    name="campo5experiencia" 
    id="campo5experiencia" 
    placeholder="Digite sua experiência profissional" 
    rows="5" 
    required></textarea>

    <input name="Enviar" type="submit" id="enviar" value="Enviar Cadastro">

  </form>
</div>

</body>
</html>
